<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard | Quản lý Đơn hàng</title>

    <!-- Kết nối chung file CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-layout">
    
    <!-- 1. SIDEBAR -->
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-icon">Z</div>
            <div class="logo-text">
                <strong>CRM</strong>
                <span>Quản Lý Khách Hàng</span>
            </div>
        </div>

        <ul class="nav-menu">
            <li><a href="index.html"><span class="icon">🏠</span> Trang chủ</a></li>
            <li><a href="khach-hang.html"><span class="icon">👥</span> Khách hàng</a></li>
            <li><a href="don-hang.html" class="active"><span class="icon">📦</span> Đơn hàng</a></li>
            <li><a href="san-pham.html"><span class="icon">🛍️</span> Sản phẩm</a></li>
            <li><a href="bao-cao.html"><span class="icon">📊</span> Báo cáo</a></li>
            <li><a href="cai-dat.html"><span class="icon">⚙️</span> Cài đặt</a></li>
        </ul>

        <div class="api-widget" id="exchangeRateWidget">
            <h4>💱 Tỷ giá USD/VND</h4>
            <p id="rateText">⏳ Đang tải...</p>
            <button id="refreshRate">Cập nhật ngay</button>
        </div>
    </aside>

    <!-- 2. MAIN CONTENT -->
    <main class="main-content">
      
      <!-- TOPBAR (Đã gỡ bỏ ô tìm kiếm thừa, giữ lại thông báo và profile) -->
      <header class="top-bar" style="display: flex; justify-content: flex-end; align-items: center;">
          <div class="top-bar-right" style="display: flex; align-items: center; gap: 25px; margin-right: 20px;">
              <div class="notification" style="position: relative; display: flex; align-items: center; cursor: pointer; font-size: 1.4rem;">
                  <span>🔔</span>
                  <span class="badge" style="position: absolute; top: -5px; right: -8px; background-color: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold; border: 2px solid #ffffff;">3</span>
              </div>
              
              <div class="user-profile" style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                  <div class="avatar" style="width: 42px; height: 42px; background-color: #f26d21; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; flex-shrink: 0;">
                      ĐH
                  </div>
                  <div class="user-info" style="display: flex; flex-direction: column;">
                      <strong style="font-size: 0.95rem; color: #1e293b; white-space: nowrap;">Đoàn Duy Hưng</strong>
                      <span style="font-size: 0.8rem; color: #64748b;">Admin ⌄</span>
                  </div>
              </div>
          </div>
      </header>

      <!-- KHU VỰC NỘI DUNG QUẢN LÝ ĐƠN HÀNG -->
      <div class="order-management-container" style="background: white; padding: 24px 28px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);">
          
          <!-- Tiêu đề -->
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
              <h2 style="font-size: 1.2rem; font-weight: 700; color: #0f172a;">Danh sách đơn hàng</h2>
          </div>

          <!-- FORM THÊM ĐƠN HÀNG NHANH -->
          <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #e2e8f0;">
              <h4 style="margin-bottom: 15px; color: #0f172a; font-size: 1rem;">Thêm Đơn Hàng Mới</h4>
              <form id="orderForm" style="display: flex; gap: 20px; align-items: flex-end;">
                  <div style="flex: 1;">
                      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 8px;">Tên khách hàng <span style="color: red;">*</span></label>
                      <input type="text" id="cusName" required placeholder="Nhập tên khách hàng" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
                  </div>
                  <div style="flex: 1;">
                      <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #334155; margin-bottom: 8px;">Giá trị đơn (VNĐ) <span style="color: red;">*</span></label>
                      <input type="number" id="orderValue" required placeholder="Ví dụ: 15000000" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none;">
                  </div>
                  <button type="submit" style="background-color: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; height: fit-content; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.2);">
                      + Lưu đơn hàng
                  </button>
              </form>
          </div>

          <!-- Thanh tìm kiếm và bộ lọc chuyên dụng (Toolbar chuẩn) -->
          <div style="display: flex; gap: 12px; margin-bottom: 20px;">
              <div style="flex: 2; position: relative;">
                  <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8;">🔍</span>
                  <input type="text" id="searchInput" placeholder="Tìm kiếm theo mã đơn, tên khách hàng..." style="width: 100%; padding: 10px 14px 10px 38px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; background: #f8fafc;">
              </div>
              <div style="flex: 1;">
                  <select style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; background: #f8fafc; color: #334155; cursor: pointer;">
                      <option>Tất cả</option>
                      <option>Đã giao</option>
                      <option>Đang xử lý</option>
                      <option>Chờ xác nhận</option>
                  </select>
              </div>
              <div style="flex: 1;">
                  <select style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; background: #f8fafc; color: #334155; cursor: pointer;">
                      <option>Sắp xếp</option>
                      <option>Mới nhất</option>
                      <option>Giá trị cao nhất</option>
                  </select>
              </div>
          </div>

          <!-- Bảng danh sách đơn hàng -->
          <table class="custom-table" style="width: 100%; border-collapse: collapse; text-align: left;">
              <thead>
                  <tr style="background-color: #f8fafc; color: #475569; font-weight: 700; font-size: 0.75rem; border-bottom: 2px solid #e2e8f0;">
                      <th style="padding: 12px 16px;">#</th>
                      <th style="padding: 12px 16px;">Mã đơn</th>
                      <th style="padding: 12px 16px;">Khách hàng</th>
                      <th style="padding: 12px 16px;">Tổng tiền</th>
                      <th style="padding: 12px 16px;">Ngày tạo</th>
                      <th style="padding: 12px 16px;">Trạng thái</th>
                      <th style="padding: 12px 16px; text-align: center;">Thao tác</th>
                  </tr>
              </thead>
              <tbody id="orderTableBody">
              </tbody>
          </table>

          <!-- PHÂN TRANG ĐỘNG -->
          <div id="paginationContainer" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 24px;"></div>

      </div>
    </main>

  </div>

  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
